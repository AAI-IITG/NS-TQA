# Level-1 synthetic benchmark generation
n_instances: 2000
n_channels: 4
T: 48
seed: 0
families: [existence, persistence, temporal_order, conjunction]
enforce_learnable: true       # drop instances whose phi* is not answerable from X
min_yes_frac: 0.10            # guard: reject benchmark if answers too imbalanced
max_yes_frac: 0.90
