# WO-2A: faithful LLM-bridge baseline (frozen Qwen2.5-Instruct).
# The signal enters a frozen instruct LLM as projected time tokens; the answer is the
# yes/no next-token logit margin. Only the TS encoder + projection train (LLM frozen).
# Same train split + answer labels as every other baseline (nothing privileged).
run_root: runs/llm_bridge_instruct

# local paths on the cluster (offline). switch to Qwen2.5-7B-Instruct for the heavy arm.
model_path: Qwen/Qwen2.5-1.5B-Instruct
dtype: fp32                # fp32 for gradient stability of the soft-prefix (H100 fp32 is fast)
n_tokens: 8                 # number of time tokens (soft prefix)
use_lora: true              # frozen-only LLM could not fit (sanity plateaued ~0.83); LoRA per work order flag
run_shortcut: true          # headline: does the LLM-bridge collapse to the planted shortcut like other end-to-end models?
spurious_strength: 3.0

datasets:
  xjtu:
    adapter:
      root: data/raw/XJTU-SY_Bearing_Datasets/Data/XJTU-SY_Bearing_Datasets
      fs: 25600
      n_bands: 3
      min_snapshots: 1
      cache_path: data/processed/xjtu_hi.pkl
      hi_q: 0.85
      lo_q: 0.15
    build:
      T: 32
      stride: 2
      depths: [1, 2, 3, 4]
      shift: condition
      train_conditions: [35Hz12kN]
      test_conditions: [37.5Hz11kN, 40Hz10kN]
      indist_holdout_frac: 0.4
      n_train_per_depth: 150
      n_test_per_depth: 120
      smooth_k: 5
      a_level: 4.0
      allow_until: false
      max_windows_per_unit: 300
      over_factor: 120
      build_seed: 0
  cmapss:
    adapter:
      root: data/raw/CMAPSS
      rul_cap: 125
      flat_std_thresh: 1.0e-6
      min_qspan: 0.05
    build:
      T: 48
      stride: 4
      depths: [1, 2, 3, 4]
      shift: condition
      train_conditions: [FD001]
      test_conditions: [FD002, FD004]
      indist_holdout_frac: 0.2
      n_train_per_depth: 150
      n_test_per_depth: 120
      smooth_k: 5
      a_level: 4.0
      allow_until: false
      max_windows_per_unit: 200
      over_factor: 60
      build_seed: 0

train:
  epochs: 20
  sanity_epochs: 80
  lr: 2.0e-4
  batch_size: 8
  grad_accum: 4

experiment:
  seeds: [0, 1, 2, 3, 4]     # 5 seeds (LLM runs are the budget item, per work order)
